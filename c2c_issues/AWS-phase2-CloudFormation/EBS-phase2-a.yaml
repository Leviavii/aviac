AWSTemplateFormatVersion: "2010-09-09"
Description: EBS-001 volume encryption variants (no CMK)
Parameters:
  LabAz:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-2a
Resources:
  Vol1:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Ref LabAz
      Size: 1
      Tags:
        - Key: Rule
          Value: EBS-001
        - Key: Case
          Value: no-encrypted-key
  Vol2:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Ref LabAz
      Size: 1
      Encrypted: false
      Tags:
        - Key: Rule
          Value: EBS-001
        - Key: Case
          Value: encrypted-false
  Vol3:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Ref LabAz
      Size: 1
      Encrypted: "false"
      Tags:
        - Key: Rule
          Value: EBS-001
        - Key: Case
          Value: encrypted-string-false
  Vol4:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Ref LabAz
      Size: 1
      Encrypted: true
      Tags:
        - Key: Rule
          Value: EBS-001
        - Key: Case
          Value: aws-managed-default-key
  Vol5:
    Type: AWS::EC2::Volume
    Properties:
      AvailabilityZone: !Ref LabAz
      Size: 1
      Encrypted: true
      KmsKeyId: alias/aws/ebs
      Tags:
        - Key: Rule
          Value: EBS-001
        - Key: Case
          Value: aws-managed-alias
