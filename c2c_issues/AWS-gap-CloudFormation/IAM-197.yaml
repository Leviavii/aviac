AWSTemplateFormatVersion: "2010-09-09"
Description: IAM-197 versions
Resources:
  Iam197StringRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: c2cgap-iam197-string-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Rule
          Value: IAM-197
        - Key: Project
          Value: wiz-c2c-gap
  Iam197String:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: c2cgap-iam197-string
      Roles:
        - !Ref Iam197StringRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: s3:*
            Resource: "*"
  Iam197ListRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: c2cgap-iam197-list-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Tags:
        - Key: Rule
          Value: IAM-197
        - Key: Project
          Value: wiz-c2c-gap
  Iam197List:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: c2cgap-iam197-list
      Roles:
        - !Ref Iam197ListRole
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:*
              - logs:CreateLogGroup
            Resource: "*"
